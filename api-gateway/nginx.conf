events {
    worker_connections 1024;
}

http {
    upstream product_service_lb {
        # server 1 for product-service
        server product-service-1:3001;
        # server 2 for product-service
        server product-service-2:3002;
    }

    server {
        listen 80;

        # Auth verification endpoint for Nginx auth_request
        location = /api/auth/verify {
            internal;
            proxy_pass http://auth-service:3000/api/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # Public auth routes (login, signup)
        location /api/auth {
            proxy_pass http://auth-service:3000/api/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Auth service health check
        location /health {
            proxy_pass http://auth-service:3000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Protected product routes
        location /api/products {
            auth_request /api/auth/verify;
            proxy_pass http://product_service_lb/api/products;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
