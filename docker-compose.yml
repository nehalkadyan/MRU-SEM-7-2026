# services:
# create one service for mongo
# create one service for auth
services:
  mongo:
    container_name: mongo
    # pulling image mongo from dockerhub
    image: mongo:7.0
    # exposing port 27017
    ports:
      - "27017:27017"
    # volume is used to store data in your local hard disk in your system
    volumes:
      - mongo-data:/data/db

  auth-service:
    # command used to build the image, "./auth-service is the path where"
    # Dockerfile lives
    build: "./auth-service"
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      - PORT=3000

  product-service:
    # command used to build the image, "./auth-service is the path where"
    build: "./product-service"
    # making sure mongo contains spins up first, since product service depends on it
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      - PORT=3001

  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "8080:80"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - product-service

# volume to persist data for mongodb in hard disk
volumes:
  mongo-data:
